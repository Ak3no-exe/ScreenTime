name: Build ScreenTime APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Intégrer le plugin natif UsageStats
        run: |
          D=android/app/src/main/java/com/screentimestats/app
          mkdir -p $D
          cp android-native/*.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"/>\n    <queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>\n    <application#' $M
          grep -c PACKAGE_USAGE_STATS $M
      - name: Synchroniser
        run: npx cap sync android
      - name: Compiler l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeStats-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
